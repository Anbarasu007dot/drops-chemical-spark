    <style>
    .atom-spinner, .atom-spinner * {
      box-sizing: border-box;
    }
    .atom-spinner {
      height: 200px; /* Increased size for prominence */
      width: 200px;
      overflow: hidden;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: transparent;
      z-index: 9999;
      transition: opacity 0.6s ease;
      /* Responsive scaling for mobile */
    }
    @media (max-width: 600px) {
      .atom-spinner {
        height: 120px;
        width: 120px;
      }
    }
    .atom-spinner.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .atom-spinner .spinner-inner {
      position: relative;
      display: block;
      height: 100%;
      width: 100%;
    }
    .atom-spinner .spinner-line {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border-left-width: calc(200px / 25);
      border-top-width: calc(200px / 25);
      border-left-color: #004080;
      border-left-style: solid;
      border-top-style: solid;
      border-top-color: transparent;
      box-shadow: 0 0 16px 2px #85c1e9;
    }
    .atom-spinner .spinner-line:nth-child(1) {
      animation: atom-spinner-animation-1 1.5s ease-in-out infinite;
      transform: rotateZ(120deg) rotateX(66deg) rotateZ(0deg);
    }
    .atom-spinner .spinner-line:nth-child(2) {
      animation: atom-spinner-animation-2 1.5s ease-in-out infinite;
      transform: rotateZ(240deg) rotateX(66deg) rotateZ(0deg);
    }
    .atom-spinner .spinner-line:nth-child(3) {
      animation: atom-spinner-animation-3 1.5s ease-in-out infinite;
      transform: rotateZ(360deg) rotateX(66deg) rotateZ(0deg);
    }
    .atom-spinner .spinner-circle {
      display: block;
      position: absolute;
      color: #5dade2;
      font-size: calc(200px * 0.24);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-shadow: 0 0 12px #85c1e9;
    }
    @media (max-width: 600px) {
      .atom-spinner .spinner-circle {
        font-size: calc(120px * 0.24);
      }
      .atom-spinner .spinner-line {
        border-left-width: calc(120px / 25);
        border-top-width: calc(120px / 25);
      }
    }
    @keyframes atom-spinner-animation-1 {
      100% {
        transform: rotateZ(120deg) rotateX(66deg) rotateZ(360deg);
      }
    }
    @keyframes atom-spinner-animation-2 {
      100% {
        transform: rotateZ(240deg) rotateX(66deg) rotateZ(360deg);
      }
    }
    @keyframes atom-spinner-animation-3 {
      100% {
        transform: rotateZ(360deg) rotateX(66deg) rotateZ(360deg);
      }
    }
    </style>
  </head>

  <body>
    <div id="preloader" class="atom-spinner">
      <div class="spinner-inner">
        <div class="spinner-line"></div>
        <div class="spinner-line"></div>
        <div class="spinner-line"></div>
        <div class="spinner-circle">&#9679;</div>
      </div>
    </div>
    <div id="root"></div>
    <!-- IMPORTANT: DO NOT REMOVE THIS SCRIPT TAG OR THIS VERY COMMENT! -->
    <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
    // Fade out preloader once window fully loads
    window.addEventListener('load', () => {
      const preloader = document.getElementById('preloader');
      preloader.classList.add('fade-out');
      setTimeout(() => {
        preloader.style.display = 'none';
      }, 600);
    });
  </script>
  </body>
